<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-SENTINEL // NEXUS SHORT</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-red: #f85149;
            --accent-green: #3fb950;
            --accent-blue: #00f0ff;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: monospace; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-red); padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 20px; color: var(--accent-red); letter-spacing: 1px; }
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; }
        .card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        .card-value { font-size: 22px; font-weight: bold; margin: 8px 0; color: #fff; }
        table { width: 100%; border-collapse: collapse; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        th { color: var(--text-muted); text-transform: uppercase; font-size: 10px; background: #1c2128; }
    </style>
</head>
<body>
    <div class="header">
        <h1>G-SENTINEL // NEXUS SHORT (PATA 4)</h1>
        <span id="last-update" style="color: var(--text-muted); font-size: 12px;">Cargando...</span>
    </div>

    <div class="grid-kpi">
        <div class="card">
            <div class="card-title">Estrategia</div>
            <div class="card-value" style="color:var(--accent-red)">BEARISH SHORT</div>
        </div>
        <div class="card">
            <div class="card-title">Slots Activos</div>
            <div class="card-value" id="slots-count">0 / 4</div>
        </div>
        <div class="card">
            <div class="card-title">Filtro Tendencial</div>
            <div class="card-value" style="color:var(--accent-blue)">Precio < EMA 200</div>
        </div>
    </div>

    <div style="color: var(--accent-red); font-weight: bold; margin-bottom: 10px;">MATRIZ DE POSICIONES CORTAS ACTIVAS</div>
    <table>
        <thead>
            <tr>
                <th>Activo</th>
                <th>Precio Entrada</th>
                <th>Stop Loss (SL %)</th>
                <th>Take Profit (TP %)</th>
                <th>Timestamp Entrada</th>
            </tr>
        </thead>
        <tbody id="pos-table">
            <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Buscando señales cortas en el mercado...</td></tr>
        </tbody>
    </table>

    <script>
        async function loadData() {
            try {
                const res = await fetch('posiciones.json');
                const data = await res.json();
                
                const keys = Object.keys(data);
                document.getElementById('slots-count').innerText = keys.length + ' / 4';

                const tbody = document.getElementById('pos-table');
                if (keys.length > 0) {
                    tbody.innerHTML = keys.map(k => {
                        const p = data[k];
                        return `<tr>
                            <td><b>${k.toUpperCase()}</b></td>
                            <td>$${p.entry_price}</td>
                            <td style="color:var(--accent-red)">-${p.sl_pct}%</td>
                            <td style="color:var(--accent-green)">+${p.tp_pct}%</td>
                            <td>${p.timestamp}</td>
                        </tr>`;
                    }).join('');
                }
            } catch (e) { console.log("Sin posiciones activas."); }
        }
        loadData();
    </script>
</body>
</html>
